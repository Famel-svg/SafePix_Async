spring:
  application:
    name: SafePix Async
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:safepix}
    password: ${SPRING_RABBITMQ_PASSWORD:safepix}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      pixAntifraud:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

safepix:
  consumer:
    concurrency: ${SAFEPIX_CONSUMER_CONCURRENCY:1}
    processing-delay-ms: ${SAFEPIX_CONSUMER_PROCESSING_DELAY_MS:2000}
    executor:
      core-pool-size: ${SAFEPIX_CONSUMER_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${SAFEPIX_CONSUMER_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${SAFEPIX_CONSUMER_EXECUTOR_QUEUE_CAPACITY:100}
  rabbitmq:
    message-ttl-ms: ${SAFEPIX_RABBITMQ_MESSAGE_TTL_MS:3600000}
    listener:
      retry:
        max-attempts: ${SAFEPIX_RABBITMQ_RETRY_MAX_ATTEMPTS:3}
        initial-interval-ms: ${SAFEPIX_RABBITMQ_RETRY_INITIAL_INTERVAL_MS:500}
        multiplier: ${SAFEPIX_RABBITMQ_RETRY_MULTIPLIER:2.0}
        max-interval-ms: ${SAFEPIX_RABBITMQ_RETRY_MAX_INTERVAL_MS:5000}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    famel.com.safepix_async: ${APP_LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    famel.com.safepix_async: ${APP_LOG_LEVEL:DEBUG}

---
spring:
  config:
    activate:
      on-profile: test
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

logging:
  level:
    famel.com.safepix_async: ${APP_LOG_LEVEL:INFO}
