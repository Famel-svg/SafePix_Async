name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # verify executa testes unitarios e de integracao (Testcontainers usa o Docker do runner)
      # e o goal jacoco:check (execution check-service-domain-coverage), que falha o build
      # se a cobertura de linhas dos pacotes service e domain ficar abaixo de 80%.
      - name: Verify
        run: ./mvnw -B verify

      - name: Upload JaCoCo HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-html
          path: target/site/jacoco/
          if-no-files-found: error
